<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard JSON</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif
}

body{
background:#0f172a;
color:#fff;
min-height:100vh
}

.topbar{
width:100%;
padding:20px;
background:#111827;
border-bottom:1px solid #1e293b;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:15px
}

.topbar h1{
font-size:28px
}

.actions{
display:flex;
gap:10px;
flex-wrap:wrap
}

button,label.uploadBtn{
border:none;
padding:12px 18px;
border-radius:12px;
font-weight:bold;
cursor:pointer;
background:#2563eb;
color:#fff;
display:flex;
align-items:center;
justify-content:center
}

.save{
background:#16a34a
}

.export{
background:#7c3aed
}

.container{
display:grid;
grid-template-columns:320px 1fr 420px;
gap:20px;
padding:20px
}

.sidebar{
background:#111827;
border-radius:18px;
padding:20px;
height:calc(100vh - 120px);
overflow:auto;
border:1px solid #1e293b
}

.editor{
background:#111827;
border-radius:18px;
padding:20px;
height:calc(100vh - 120px);
overflow:auto;
border:1px solid #1e293b
}

.preview{
background:#111827;
border-radius:18px;
padding:20px;
height:calc(100vh - 120px);
overflow:auto;
border:1px solid #1e293b
}

.sectionItem{
padding:14px;
background:#1e293b;
border-radius:12px;
margin-bottom:10px;
cursor:pointer;
transition:.2s
}

.sectionItem:hover{
background:#2563eb
}

.sectionItem.active{
background:#2563eb
}

.field{
margin-bottom:20px
}

.field label{
display:block;
margin-bottom:8px;
font-size:14px
}

.field input,
.field textarea,
.field select{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#1e293b;
color:#fff;
outline:none
}

.field textarea{
resize:vertical;
min-height:100px
}

.arrayBox{
background:#1e293b;
padding:15px;
border-radius:14px;
margin-bottom:15px
}

.arrayTitle{
font-size:14px;
margin-bottom:12px;
opacity:.8
}

.card{
background:#1e293b;
padding:15px;
border-radius:14px;
margin-bottom:15px
}

.card h3{
margin-bottom:12px;
font-size:16px
}

.preview pre{
white-space:pre-wrap;
word-break:break-word;
font-size:13px;
line-height:1.5;
color:#22c55e
}

.previewMode{
display:flex;
gap:10px;
margin-bottom:20px
}

.previewMode button{
flex:1
}

.hidden{
display:none
}

#plainText{
color:#fff
}

.empty{
opacity:.5;
text-align:center;
padding:40px 0
}

@media(max-width:1300px){

.container{
grid-template-columns:1fr
}

.sidebar,
.editor,
.preview{
height:auto
}

}
</style>
</head>
<body>

<div class="topbar">

<h1>Dashboard JSON</h1>

<div class="actions">

<label class="uploadBtn">
Subir JSON
<input type="file" id="jsonFile" accept=".json" hidden>
</label>

<button class="save" onclick="saveJson()">Guardar JSON</button>

<button class="export" onclick="exportPlain()">Exportar TXT</button>

</div>

</div>

<div class="container">

<div class="sidebar">

<h2 style="margin-bottom:20px">Secciones</h2>

<div id="sections"></div>

</div>

<div class="editor">

<div id="editorContent">

<div class="empty">
Sube un JSON para empezar
</div>

</div>

</div>

<div class="preview">

<div class="previewMode">

<button onclick="showPreview('json')">JSON</button>
<button onclick="showPreview('plain')">Texto plano</button>

</div>

<pre id="jsonPreview">Esperando JSON...</pre>

<pre id="plainText" class="hidden">Esperando texto...</pre>

</div>

</div>

<script>

let jsonData={}
let currentSection=null

const sections=document.getElementById("sections")
const editorContent=document.getElementById("editorContent")
const jsonPreview=document.getElementById("jsonPreview")
const plainText=document.getElementById("plainText")

document.getElementById("jsonFile").addEventListener("change",e=>{

const file=e.target.files[0]

if(!file) return

const reader=new FileReader()

reader.onload=function(ev){

try{

jsonData=JSON.parse(ev.target.result)

renderSections()
updatePreview()

}catch{

alert("JSON inválido")

}

}

reader.readAsText(file)

})

function renderSections(){

sections.innerHTML=""

Object.keys(jsonData).forEach(key=>{

const div=document.createElement("div")

div.className="sectionItem"

div.innerText=key

div.onclick=()=>{

document.querySelectorAll(".sectionItem").forEach(x=>{
x.classList.remove("active")
})

div.classList.add("active")

openSection(key)

}

sections.appendChild(div)

})

}

function openSection(key){

currentSection=key

const data=jsonData[key]

editorContent.innerHTML=""

if(typeof data==="object" && !Array.isArray(data)){

Object.keys(data).forEach(sub=>{

createField(sub,data[sub])

})

}else if(Array.isArray(data)){

data.forEach((item,index)=>{

const box=document.createElement("div")

box.className="arrayBox"

box.innerHTML=`
<div class="arrayTitle">Elemento ${index+1}</div>
`

if(typeof item==="object"){

Object.keys(item).forEach(sub=>{

const field=createInput(sub,item[sub],val=>{

jsonData[key][index][sub]=parseValue(val)
updatePreview()

})

box.appendChild(field)

})

}else{

const field=createInput("valor",item,val=>{

jsonData[key][index]=parseValue(val)
updatePreview()

})

box.appendChild(field)

}

editorContent.appendChild(box)

})

}else{

createField(key,data,true)

}

}

function createField(name,value,single=false){

const field=createInput(name,value,val=>{

if(single){
jsonData[name]=parseValue(val)
}else{
jsonData[currentSection][name]=parseValue(val)
}

updatePreview()

})

editorContent.appendChild(field)

}

function createInput(labelText,value,callback){

const field=document.createElement("div")

field.className="field"

const label=document.createElement("label")
label.innerText=labelText

let input

if(typeof value==="string" && value.length>60){

input=document.createElement("textarea")
input.value=value

}else{

input=document.createElement("input")
input.value=typeof value==="object"
?JSON.stringify(value)
:value

}

input.oninput=()=>{

callback(input.value)

}

field.appendChild(label)
field.appendChild(input)

return field

}

function parseValue(val){

try{
return JSON.parse(val)
}catch{}

if(val==="true") return true
if(val==="false") return false

if(!isNaN(val) && val.trim()!==""){
return Number(val)
}

return val

}

function updatePreview(){

jsonPreview.textContent=
JSON.stringify(jsonData,null,4)

plainText.textContent=
convertToText(jsonData)

}

function convertToText(obj,indent=""){

let txt=""

Object.entries(obj).forEach(([k,v])=>{

if(Array.isArray(v)){

txt+=`${indent}${k}:\n`

v.forEach((item,index)=>{

txt+=`${indent}- Elemento ${index+1}\n`

if(typeof item==="object"){
txt+=convertToText(item,indent+"  ")
}else{
txt+=`${indent}  ${item}\n`
}

})

}else if(typeof v==="object" && v!==null){

txt+=`${indent}${k}:\n`
txt+=convertToText(v,indent+"  ")

}else{

txt+=`${indent}${k}: ${v}\n`

}

})

return txt

}

function showPreview(type){

if(type==="json"){

jsonPreview.classList.remove("hidden")
plainText.classList.add("hidden")

}else{

plainText.classList.remove("hidden")
jsonPreview.classList.add("hidden")

}

}

function saveJson(){

const blob=new Blob(
[
JSON.stringify(jsonData,null,4)
],
{
type:"application/json"
}
)

const a=document.createElement("a")

a.href=URL.createObjectURL(blob)

a.download="editado.json"

a.click()

}

function exportPlain(){

const blob=new Blob(
[
plainText.textContent
],
{
type:"text/plain"
}
)

const a=document.createElement("a")

a.href=URL.createObjectURL(blob)

a.download="json.txt"

a.click()

}
</script>

</body>
</html>
