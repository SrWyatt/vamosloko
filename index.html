<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lokomotiv El Salvador</title>
    <link class="code-link" rel="stylesheet" href="style.css?v=15">
    <meta name="description" content="En este sitio se habla sobre FC Lokomotiv, Rusia, El Salvador y muchos equipos al rededor del mundo que une a esta cultura bajo el deporte más grande de todos.">
    <meta name="keywords" content="futbol, fc lokomotiv, el salvador, san miguel, cd aguila, vamosloko, futbol ruso, spartak, zenit, estadisticas de futbol, liga mayor, lm, rpl, russian premier liga, russian premier league, liga rusa, russia, rusia, ruso, equipos de rusia, futbol ruso, fútbol ruso">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://vamosloko.netlify.app/">
    <meta property="og:title" content="#VAMOSLOKO | Lokomotiv El Salvador">
    <meta property="og:description" content="Estadísticas, análisis y el pulso del fútbol desde El Salvador hasta Moscú.">
    <meta property="og:url" content="https://vamosloko.netlify.app/">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://vamosloko.netlify.app/banner-default.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:type" content="image/png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="#VAMOSLOKO | Lokomotiv El Salvador">
    <meta name="twitter:description" content="Estadísticas, análisis y el pulso del fútbol desde San Miguel hasta Moscú.">
    <meta name="twitter:image" content="https://vamosloko.netlify.app/banner-default.png">


</head>
<body>
    <nav class="navbar">
        <div class="nav-side">
            <button class="hamburger-btn" id="menu-btn">
                <span class="svg-icon icon-menu"></span>
            </button>
        </div>
        <div class="nav-center">
            <a href="./" id="logo-btn" style="text-decoration: none; color: inherit;">
                #VAMOSLOKO
            </a>
        </div>
        <div class="nav-side"></div>
    </nav>

    <div class="dropdown-menu" id="dropdown-menu">
        <a href="./" class="nav-link">Inicio</a>
        <a href="equipo/" class="nav-link">Estadísticas</a>
        <a href="about/" class="nav-link">Sobre mí</a>
    </div>

    <header class="main-header" id="main-header">
        <h1>El Loko</h1>
    </header>

    <div id="view-home" class="view-section active">
        <div class="search-section">
            <div class="search-container">
                <input type="text" id="search-input" placeholder="BUSCAR POR TÍTULO O ID (EJ: 001)...">
                <button type="button" id="search-btn">
                    <span class="svg-icon icon-search"></span>
                </button>
            </div>
        </div>

        <div class="layout-container">
            <main class="main-content">
                <section class="recent-posts">
                    <div style="display: flex; margin-bottom: 10px; align-items: center; justify-content: flex-start;">
                        <button id="sort-toggle-btn" style="background: none; border: none; font-size: 1rem; color: #171718; display: flex; align-items: center; gap: 5px; cursor: pointer; font-family: 'Arial Black', sans-serif; text-transform: uppercase;">
                            <span id="sort-icon" class="svg-icon icon-pan-up" style="width: 20px; height: 20px;"></span>
                            <span id="sort-text">Más reciente</span>
                        </button>
                    </div>
                    <h2>ÚLTIMAS PUBLICACIONES</h2>
                    <div class="posts-list" id="posts-container"></div>
                </section>
            </main>
        </div>
    </div>

    <div id="view-post" class="view-section">
        <div class="post-layout-container">
            <div class="post-header-full">
                <div class="post-header-info">
                    <span id="single-post-id"></span>
                    <span id="single-post-date"></span>
                </div>
                <h1 id="single-post-title"></h1>
                <div class="single-post-image" id="single-post-image-container"></div>
            </div>
            
            <div class="post-body-layout">
                <article class="single-post-body" id="single-post-body"></article>
                
                <aside class="post-sidebar">
                    <div class="sidebar-block">
                        <h3>HISTORIAL</h3>
                        <div id="history-accordion" class="history-accordion"></div>
                    </div>
                </aside>
            </div>
        </div>
    </div>

    <div id="view-page" class="view-section">
        <div class="page-layout-container">
            <h1 id="page-title"></h1>
            <div class="page-body" id="page-body"></div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <button class="scroll-to-top" id="scroll-to-top">
        <span class="svg-icon icon-arrow-up"></span>
    </button>

    <script src="script.js?v=15"></script>
</body>
</html>
