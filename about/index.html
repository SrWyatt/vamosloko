<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobre mí - Lokomotiv El Salvador</title>
    <link class="code-link" rel="stylesheet" href="../style.css?v=21">
    <style>
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            margin-top: 30px;
        }
        .gallery-card {
            background-color: #fcfcfc;
            border: 4px solid #171718;
            box-shadow: 6px 6px 0px #348d8b;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .gallery-card:hover {
            transform: translateY(-5px);
            box-shadow: 8px 8px 0px #e33046;
        }
        .gallery-img-container {
            position: relative;
            width: 100%;
            height: 220px;
            background-color: #171718;
            overflow: hidden;
            border-bottom: 4px solid #171718;
        }
        .gallery-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .gallery-btn {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background-color: #e33046;
            color: #fcfcfc;
            padding: 8px 15px;
            font-family: 'Arial Black', sans-serif;
            font-size: 0.75rem;
            text-transform: uppercase;
            text-decoration: none;
            border: 2px solid #171718;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 3px 3px 0px #171718;
            transition: background-color 0.15s, transform 0.1s;
            z-index: 10;
        }
        .gallery-btn:hover {
            background-color: #348d8b;
            transform: scale(1.02);
        }
        .icon-arrow-top-right {
            width: 14px;
            height: 14px;
            display: inline-block;
            background-color: #fcfcfc;
            -webkit-mask-image: url('../icons/arrow-top-right-thick.svg');
            mask-image: url('../icons/arrow-top-right-thick.svg');
            -webkit-mask-size: contain;
            mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-position: center;
        }
        .gallery-content {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            background-color: #fcfcfc;
            text-align: left;
        }
        .gallery-site-name {
            font-family: 'Arial', sans-serif;
            font-weight: 600;
            font-size: 0.75rem;
            color: #71717a;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            text-align: left;
        }
        .gallery-card-title {
            font-size: 1.3rem;
            color: #203837;
            line-height: 1.3;
            font-weight: 900;
            text-transform: uppercase;
            margin: 0 0 12px 0;
            text-align: left;
        }
        .gallery-badge-container {
            display: flex;
            align-items: center;
            text-align: left;
        }
        .badge-interview {
            background-color: #171718;
            color: #d4af37;
            border: 1px solid #d4af37;
            padding: 3px 8px;
            font-size: 0.65rem;
            font-family: 'Arial Black', sans-serif;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            display: inline-block;
            border-radius: 2px;
        }
        .badge-default {
            background-color: #348d8b;
            color: #fcfcfc;
            padding: 3px 8px;
            font-size: 0.65rem;
            font-family: 'Arial Black', sans-serif;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            display: inline-block;
            border: 3px solid #ffffff;
            border-radius: 2px;
        }
        .no-media {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e33046;
            font-size: 1rem;
            background-color: #171718;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-side">
            <button class="hamburger-btn" id="menu-btn">
                <span class="svg-icon icon-menu"></span>
            </button>
        </div>
        <div class="nav-center">
            <a href="../" id="logo-btn" style="text-decoration: none; color: inherit;">#VAMOSLOKO</a>
        </div>
        <div class="nav-side"></div>
    </nav>

    <div class="dropdown-menu" id="dropdown-menu">
        <a href="../" class="nav-link">Inicio</a>
        <a href="../equipo/" class="nav-link">Estadísticas</a>
        <a href="../about/" class="nav-link">Conóceme</a>

    </div>

    <div class="view-section active">
        <div class="page-layout-container" style="padding-top:40px;min-height:50vh;">
            <div id="gallery-container" class="gallery-grid"></div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <button class="scroll-to-top" id="scroll-to-top" aria-label="Volver arriba">
        <span class="svg-icon icon-arrow-up"></span>
    </button>

<script src="../script.js?v=21"></script>
    <script>
        (function() {
            const basePath = (() => {
                const path = window.location.pathname;
                if (path.includes('/about/') || path.includes('/redes/') || path.includes('/equipo/')) {
                    return '../';
                }
                return '';
            })();

            function getValidImgSrc(src) {
                if (!src) return '';
                if (src.startsWith('http://') || src.startsWith('https://')) return src;
                return basePath + src;
            }

            function getBadgeHTML(tipo) {
                if (tipo === 'Entrevista') {
                    return '<span class="badge-interview">ENTREVISTA</span>';
                }
                return '<span class="badge-default">' + (tipo || 'PUBLICACIÓN').toUpperCase() + '</span>';
            }

            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/[&<>]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    return m;
                });
            }

            async function loadGallery() {
                const container = document.getElementById('gallery-container');
                if (!container) return;
                try {
                    const res = await fetch(basePath + 'articulos/sitios.json?t=' + Date.now());
                    if (!res.ok) return;
                    const data = await res.json();
                    data.sort((a, b) => parseInt(a.posicion, 10) - parseInt(b.posicion, 10));
                    container.innerHTML = data.map(item => {
                        const imgSrc = getValidImgSrc(item.imagen);
                        return `
                            <div class="gallery-card">
                                <div class="gallery-img-container">
                                    <img src="${imgSrc}" onerror="this.outerHTML='<div class=\\'no-media\\'>NO MEDIA</div>'">
                                    <a href="${item.sitio}" target="_blank" class="gallery-btn">
                                        Ver sitio <span class="icon-arrow-top-right"></span>
                                    </a>
                                </div>
                                <div class="gallery-content">
                                    <div class="gallery-site-name">${escapeHtml(item.nombre_sitio)}</div>
                                    <h3 class="gallery-card-title">${escapeHtml(item.titulo)}</h3>
                                    <div class="gallery-badge-container">${getBadgeHTML(item.tipo)}</div>
                                </div>
                            </div>
                        `;
                    }).join('');
                } catch(e) {
                    console.error('Error loading gallery:', e);
                }
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', loadGallery);
            } else {
                loadGallery();
            }
        })();
    </script>
</body>
</html>

</body>
</html>
